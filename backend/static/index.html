<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RunWatch</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1b1f2a;
        --muted: #5f697a;
        --line: #d8deea;
        --running: #0f766e;
        --idle: #596579;
        --failed: #b42318;
        --code-bg: #101828;
        --code-text: #d0d5dd;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-padding-top: 92px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .bar,
      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 72px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
      }

      .brand-link {
        color: inherit;
        text-decoration: none;
      }

      .summary {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 14px;
      }

      #updated-short {
        display: none;
      }

      main {
        padding: 24px 0 40px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }

      .overview {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
        border: 1px solid #c7d2e5;
        border-radius: 8px;
        background: #eaf1f9;
        padding: 12px;
      }

      .overview-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        min-height: 96px;
        border: 1px solid #cbd7e8;
        border-radius: 8px;
        background: var(--panel);
        color: inherit;
        padding: 12px;
        text-decoration: none;
        transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      }

      .overview-card:hover,
      .overview-card:focus {
        border-color: #8aa3c7;
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.10);
        outline: none;
        transform: translateY(-1px);
      }

      .overview-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .overview-label {
        color: var(--muted);
        font-size: 12px;
      }

      .overview-detail {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .overview-value {
        margin-top: 4px;
        color: var(--text);
        font-size: 24px;
        line-height: 1.1;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .overview-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .overview-card.attention .overview-value {
        color: var(--failed);
      }

      .overview-value.attention {
        color: var(--failed);
      }

      .overview-value.active {
        color: var(--running);
      }

      .overview-card.good .overview-value {
        color: var(--running);
      }

      .overview-meta-strong {
        color: var(--text);
        font-weight: 700;
      }

      .overview-meta-strong.active {
        color: var(--running);
      }

      .overview-meta-strong.attention {
        color: var(--failed);
      }

      .overview-status-running {
        color: var(--running);
        font-weight: 700;
      }

      .overview-status-idle {
        color: var(--idle);
        font-weight: 700;
      }

      .overview-status-failed {
        color: var(--failed);
        font-weight: 700;
      }

      #overview,
      #quota,
      #resources,
      #ports,
      #sessions {
        scroll-margin-top: 92px;
      }

      .sessions {
        display: grid;
        gap: 20px;
      }

      .session-group {
        min-width: 0;
      }

      .session-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .session-name {
        font-size: 18px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .session-summary {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .resources,
      .ports,
      .quota {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .resource-card,
      .port-card,
      .quota-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px 16px;
      }

      .resource-title,
      .port-title,
      .quota-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 13px;
        color: var(--muted);
      }

      .resource-value {
        font-size: 24px;
        font-weight: 800;
      }

      .resource-metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .resource-metric-label {
        color: var(--muted);
        font-size: 12px;
      }

      .resource-metric-value {
        font-size: 22px;
        font-weight: 800;
      }

      .resource-meta {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .port-value {
        font-size: 22px;
        font-weight: 800;
      }

      .port-value.used {
        color: var(--failed);
      }

      .port-value.unavailable {
        color: var(--failed);
      }

      .port-value.free {
        color: var(--running);
      }

      .port-value.unknown {
        color: var(--idle);
      }

      .port-meta {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .quota-percent {
        font-size: 28px;
        font-weight: 800;
      }

      .quota-bar {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--line);
      }

      .quota-fill {
        height: 100%;
        border-radius: inherit;
        background: var(--running);
      }

      .quota-fill.warn {
        background: #b7791f;
      }

      .quota-fill.danger {
        background: var(--failed);
      }

      .quota-meta {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .pane {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .pane-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .title {
        min-width: 0;
      }

      .session {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .meta,
      .path,
      .error,
      .empty {
        color: var(--muted);
        font-size: 13px;
      }

      .badge {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 4px 9px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .running {
        background: var(--running);
      }

      .idle {
        background: var(--idle);
      }

      .failed {
        background: var(--failed);
      }

      .body {
        padding: 14px 16px 16px;
      }

      .path {
        margin-bottom: 12px;
        overflow-wrap: anywhere;
      }

      pre {
        margin: 0;
        max-height: 260px;
        overflow: auto;
        border-radius: 6px;
        background: var(--code-bg);
        color: var(--code-text);
        padding: 12px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .empty,
      .error {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 20px;
      }

      @media (max-width: 640px) {
        html {
          scroll-padding-top: 64px;
        }

        .bar {
          align-items: center;
          flex-direction: row;
          justify-content: center;
          min-height: 56px;
          padding: 8px 0;
        }

        h1 {
          font-size: 22px;
        }

        .summary {
          margin-left: auto;
          font-size: 13px;
        }

        #updated {
          display: none;
        }

        #updated-short {
          display: inline;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .overview {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
          padding: 10px;
        }

        .overview-card {
          min-height: 92px;
        }

        .overview-value {
          font-size: 21px;
        }

        .session-head {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }

        .session-summary {
          text-align: left;
        }
      }

      @media (max-width: 360px) {
        .overview {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body id="top">
    <header>
      <div class="bar">
        <h1><a class="brand-link" href="#top">RunWatch</a></h1>
        <div class="summary">
          <span id="count">0 panes</span>
          <span id="updated">Waiting for data</span>
          <span id="updated-short">--:--</span>
        </div>
      </div>
    </header>
    <main>
      <section id="overview" class="overview"></section>
      <section id="quota" class="quota"></section>
      <section id="resources" class="resources"></section>
      <section id="ports" class="ports"></section>
      <div id="sessions" class="empty">Loading status...</div>
    </main>
    <script>
      const overview = document.getElementById("overview");
      const resources = document.getElementById("resources");
      const ports = document.getElementById("ports");
      const quota = document.getElementById("quota");
      const content = document.getElementById("sessions");
      const count = document.getElementById("count");
      const updated = document.getElementById("updated");
      const updatedShort = document.getElementById("updated-short");
      const params = new URLSearchParams(window.location.search);
      const TOKEN_STORAGE_KEY = "runwatch-token";

      if (params.has("token")) {
        params.delete("token");
        const query = params.toString();
        const cleanUrl = `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      function getToken(forcePrompt = false) {
        if (forcePrompt) {
          window.localStorage.removeItem(TOKEN_STORAGE_KEY);
        }

        const stored = window.localStorage.getItem(TOKEN_STORAGE_KEY);
        if (stored && !forcePrompt) {
          return stored;
        }

        const entered = window.prompt("Monitor token");
        const token = entered ? entered.trim() : "";
        if (token) {
          window.localStorage.setItem(TOKEN_STORAGE_KEY, token);
        }
        return token;
      }

      function statusClass(status) {
        if (status === "failed") return "failed";
        if (status === "running") return "running";
        return "idle";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatWindow(minutes) {
        if (!minutes) return "window unknown";
        if (minutes % 1440 === 0) return `${minutes / 1440}d window`;
        if (minutes % 60 === 0) return `${minutes / 60}h window`;
        return `${minutes}m window`;
      }

      function formatReset(timestamp) {
        if (!timestamp) return "reset unknown";
        return `resets ${new Date(timestamp * 1000).toLocaleString()}`;
      }

      function fillClass(percent) {
        if (percent <= 10) return "danger";
        if (percent <= 25) return "warn";
        return "";
      }

      function formatPercent(value) {
        if (value === null || value === undefined) return "unknown";
        return `${Number(value).toFixed(1)}%`;
      }

      function paneCounts(panes) {
        return (panes || []).reduce((acc, pane) => {
          const status = statusClass(pane.status);
          acc.total += 1;
          acc[status] = (acc[status] || 0) + 1;
          return acc;
        }, { total: 0, running: 0, failed: 0, idle: 0 });
      }

      function paneSummary(panes) {
        const counts = paneCounts(panes);
        const statuses = [
          ["running", counts.running],
          ["failed", counts.failed],
          ["idle", counts.idle],
        ].filter(([, statusCount]) => statusCount);
        const meta = statuses
          .map(([status, statusCount]) => `${statusCount} ${status}`)
          .join(" · ") || "no active panes";
        const metaHtml = statuses.length
          ? statuses.map(([status, statusCount]) =>
              `<span class="overview-status-${status}">${statusCount} ${status}</span>`
            ).join(" · ")
          : escapeHtml(meta);
        return {
          label: "Sessions",
          target: "#sessions",
          value: `${counts.total} pane${counts.total === 1 ? "" : "s"}`,
          meta,
          metaHtml,
          tone: counts.failed ? "attention" : "good",
        };
      }

      function resourceSummary(resourceData) {
        if (!resourceData) {
          return {
            label: "Resources",
            target: "#resources",
            value: "unknown",
            meta: "waiting for data",
            tone: "",
          };
        }

        const load = resourceData.load || {};
        const memory = resourceData.memory || {};
        const gpu = (resourceData.gpus || [])[0];
        const gpuText = gpu
          ? `GPU ${formatPercent(gpu.utilization_percent)} · mem ${formatPercent(gpu.memory_used_percent)}`
          : "GPU unknown";
        const memoryText = memory.available ? `RAM ${formatPercent(memory.used_percent)}` : "RAM unknown";
        const value = load.available ? `CPU ${load.load_1m}` : "CPU unknown";
        const cpuHot = load.available && Number(load.load_1m) >= 1;
        const cpuActive = load.available && Number(load.load_1m) >= 0.1;
        const gpuHot = gpu && Number(gpu.utilization_percent) >= 80;
        const gpuMemoryHot = gpu && Number(gpu.memory_used_percent) >= 80;
        const gpuActive = gpu && (
          Number(gpu.utilization_percent) >= 1 ||
          Number(gpu.memory_used_percent) >= 1
        );
        const gpuTone = gpuHot || gpuMemoryHot ? "attention" : gpuActive ? "active" : "";
        const gpuMetaHtml = gpu
          ? `<span class="overview-meta-strong ${gpuTone}">GPU ${escapeHtml(formatPercent(gpu.utilization_percent))}</span> · mem ${escapeHtml(formatPercent(gpu.memory_used_percent))}`
          : `<span class="overview-meta-strong">GPU unknown</span>`;

        return {
          label: "Resources",
          target: "#resources",
          value,
          meta: `${memoryText} · ${gpuText}`,
          metaHtml: `${escapeHtml(memoryText)} · ${gpuMetaHtml}`,
          valueTone: cpuHot ? "attention" : cpuActive ? "active" : "",
          tone: "",
        };
      }

      function portSummary(portData) {
        const items = portData || [];
        if (!items.length) {
          return {
            label: "Ports",
            target: "#ports",
            value: "no ports",
            meta: "configure MONITOR_PORTS",
            tone: "",
          };
        }

        const occupied = items.filter((item) => item.occupied).length;
        const unavailable = items.filter((item) => item.status === "unavailable").length;
        const unknown = items.filter((item) => item.status === "unknown").length;
        const available = items.length - occupied - unavailable - unknown;
        const meta = [
          occupied ? `${occupied} occupied` : "",
          unavailable ? `${unavailable} unavailable` : "",
          unknown ? `${unknown} unknown` : "",
          available ? `${available} available` : "",
        ].filter(Boolean).join(" · ");

        return {
          label: "Ports",
          target: "#ports",
          value: `${items.length} ports`,
          meta,
          tone: unavailable || unknown ? "attention" : "",
        };
      }

      function quotaSummary(quotaData) {
        if (!quotaData) {
          return {
            label: "Codex",
            target: "#quota",
            value: "unknown",
            meta: "waiting for data",
            tone: "",
          };
        }
        if (!quotaData.available) {
          return {
            label: "Codex",
            target: "#quota",
            value: "unavailable",
            meta: quotaData.reason || "no quota snapshot",
            tone: "attention",
          };
        }

        const rateLimits = quotaData.rate_limits || {};
        const limits = ["primary", "secondary"]
          .map((name) => rateLimits[name])
          .filter(Boolean)
          .map((item) => Math.max(0, 100 - Number(item.used_percent ?? 0)));

        if (!limits.length) {
          return {
            label: "Codex",
            target: "#quota",
            value: "snapshot",
            meta: "no limits found",
            tone: "",
          };
        }

        const minLeft = Math.min(...limits);
        return {
          label: "Codex",
          target: "#quota",
          value: `${minLeft.toFixed(0)}% left`,
          meta: "minimum remaining quota",
          tone: minLeft <= 25 ? "attention" : "good",
        };
      }

      function renderOverview(data) {
        const items = [
          paneSummary(data.panes || []),
          resourceSummary(data.resources),
          portSummary(data.ports),
          quotaSummary(data.codex_quota),
        ];

        overview.innerHTML = items.map((item) => `
          <a class="overview-card ${escapeHtml(item.tone)}" href="${escapeHtml(item.target)}">
            <div>
              <div class="overview-top">
                <div class="overview-label">${escapeHtml(item.label)}</div>
                <div class="overview-detail">Details ></div>
              </div>
              <div class="overview-value ${escapeHtml(item.valueTone || "")}">${escapeHtml(item.value)}</div>
            </div>
            <div class="overview-meta">${item.metaHtml || escapeHtml(item.meta)}</div>
          </a>
        `).join("");
      }

      function renderResources(data) {
        const resourceData = data.resources;
        if (!resourceData) {
          resources.innerHTML = "";
          return;
        }

        const load = resourceData.load || {};
        const memory = resourceData.memory || {};
        const gpus = resourceData.gpus || [];
        const cards = [];

        cards.push(`
          <div class="resource-card">
            <div class="resource-title">
              <span>CPU load</span>
              <span>${load.available ? "available" : "unknown"}</span>
            </div>
            <div class="resource-value">${load.available ? escapeHtml(load.load_1m) : "unknown"}</div>
            <div class="resource-meta">${load.available ? `5m ${escapeHtml(load.load_5m)} · 15m ${escapeHtml(load.load_15m)}` : "Unable to read /proc/loadavg"}</div>
          </div>
        `);

        cards.push(`
          <div class="resource-card">
            <div class="resource-title">
              <span>Memory</span>
              <span>${memory.available ? "available" : "unknown"}</span>
            </div>
            <div class="resource-value">${memory.available ? escapeHtml(formatPercent(memory.used_percent)) : "unknown"}</div>
            <div class="resource-meta">${memory.available ? `${escapeHtml(memory.used_mb)} MB used · ${escapeHtml(memory.total_mb)} MB total` : "Unable to read /proc/meminfo"}</div>
          </div>
        `);

        if (gpus.length) {
          gpus.forEach((gpu) => {
            cards.push(`
              <div class="resource-card">
                <div class="resource-title">
                  <span>GPU ${escapeHtml(gpu.index)}</span>
                  <span>${escapeHtml(gpu.name)}</span>
                </div>
                <div class="resource-metrics">
                  <div>
                    <div class="resource-metric-label">GPU util</div>
                    <div class="resource-metric-value">${escapeHtml(formatPercent(gpu.utilization_percent))}</div>
                  </div>
                  <div>
                    <div class="resource-metric-label">Mem</div>
                    <div class="resource-metric-value">${escapeHtml(formatPercent(gpu.memory_used_percent))}</div>
                  </div>
                </div>
                <div class="resource-meta">${escapeHtml(gpu.memory_used_mb)} / ${escapeHtml(gpu.memory_total_mb)} MB · ${escapeHtml(gpu.temperature_c)}C</div>
              </div>
            `);
          });
        } else {
          cards.push(`
            <div class="resource-card">
              <div class="resource-title">
                <span>GPU</span>
                <span>unknown</span>
              </div>
              <div class="resource-value">unknown</div>
              <div class="resource-meta">${escapeHtml(resourceData.gpu_error || "No GPU data available")}</div>
            </div>
          `);
        }

        resources.innerHTML = cards.join("");
      }

      function renderQuota(data) {
        const quotaData = data.codex_quota;
        if (!quotaData) {
          quota.innerHTML = "";
          return;
        }

        if (!quotaData.available) {
          quota.innerHTML = `
            <div class="quota-card">
              <div class="quota-title">Codex quota</div>
              <div class="quota-meta">${escapeHtml(quotaData.reason || "No local quota snapshot available")}</div>
            </div>
          `;
          return;
        }

        const rateLimits = quotaData.rate_limits || {};
        const cards = ["primary", "secondary"].map((name) => {
          const item = rateLimits[name];
          if (!item) return "";
          const usedPercent = Number(item.used_percent ?? 0);
          const percent = Math.max(0, 100 - usedPercent);
          const width = Math.max(0, Math.min(100, percent));
          return `
            <div class="quota-card">
              <div class="quota-title">
                <span>Codex ${escapeHtml(name)}</span>
                <span>${escapeHtml(formatWindow(item.window_minutes))}</span>
              </div>
              <div class="quota-percent">${escapeHtml(percent.toFixed(0))}% left</div>
              <div class="quota-bar">
                <div class="quota-fill ${fillClass(percent)}" style="width: ${width}%"></div>
              </div>
              <div class="quota-meta">${escapeHtml(formatReset(item.resets_at))}</div>
            </div>
          `;
        }).join("");

        const plan = rateLimits.plan_type ? ` · ${rateLimits.plan_type}` : "";
        quota.innerHTML = cards || `
          <div class="quota-card">
            <div class="quota-title">Codex quota${escapeHtml(plan)}</div>
            <div class="quota-meta">Snapshot found, but no primary or secondary limits were present.</div>
          </div>
        `;
      }

      function renderPorts(data) {
        const portData = data.ports || [];
        if (!portData.length) {
          ports.innerHTML = "";
          return;
        }

        ports.innerHTML = portData.map((item) => {
          const isUnknown = item.status === "unknown";
          const isUnavailable = item.status === "unavailable";
          const status = isUnknown ? "unknown" : isUnavailable ? "unavailable" : item.occupied ? "used" : "free";
          const label = isUnknown ? "unknown" : isUnavailable ? "unavailable" : item.occupied ? "occupied" : "available";
          const meta = isUnknown
            ? item.error || "Unable to inspect this port"
            : isUnavailable
            ? item.error || "Port cannot be bound by this user"
            : item.occupied
            ? `${item.command || "unknown"} · PID ${item.pid || "unknown"} · ${item.address || "address unknown"}`
            : "No listener found";

          return `
            <div class="port-card">
              <div class="port-title">
                <span>Port ${escapeHtml(item.port)}</span>
                <span>${escapeHtml(label)}</span>
              </div>
              <div class="port-value ${status}">${escapeHtml(label)}</div>
              <div class="port-meta">${escapeHtml(meta)}</div>
            </div>
          `;
        }).join("");
      }

      function groupPanesBySession(panes) {
        return panes.reduce((groups, pane) => {
          const session = pane.session || "(unknown session)";
          if (!groups.has(session)) {
            groups.set(session, []);
          }
          groups.get(session).push(pane);
          return groups;
        }, new Map());
      }

      function summarizeSession(panes) {
        const counts = panes.reduce((acc, pane) => {
          const status = statusClass(pane.status);
          acc[status] = (acc[status] || 0) + 1;
          return acc;
        }, {});

        return [
          `${panes.length} pane${panes.length === 1 ? "" : "s"}`,
          counts.running ? `${counts.running} running` : "",
          counts.failed ? `${counts.failed} failed` : "",
          counts.idle ? `${counts.idle} idle` : "",
        ].filter(Boolean).join(" · ");
      }

      function renderPane(pane) {
        const output = (pane.output || []).slice(-12).join("\n");
        const status = statusClass(pane.status);
        return `
          <article class="pane">
            <div class="pane-head">
              <div class="title">
                <div class="session">${escapeHtml(pane.window)}.${escapeHtml(pane.pane_index)}</div>
                <div class="meta">${escapeHtml(pane.window_name)} · ${escapeHtml(pane.command)} · ${escapeHtml(pane.pane_id)}</div>
              </div>
              <span class="badge ${status}">${escapeHtml(pane.status)}</span>
            </div>
            <div class="body">
              <div class="path">${escapeHtml(pane.path)}</div>
              <pre>${escapeHtml(output || "(no recent output)")}</pre>
            </div>
          </article>
        `;
      }

      function renderPanes(panes) {
        const groups = groupPanesBySession(panes);
        content.className = "sessions";
        content.innerHTML = Array.from(groups.entries()).map(([session, sessionPanes]) => `
          <section class="session-group">
            <div class="session-head">
              <div class="session-name">${escapeHtml(session)}</div>
              <div class="session-summary">${escapeHtml(summarizeSession(sessionPanes))}</div>
            </div>
            <div class="grid">
              ${sessionPanes.map(renderPane).join("")}
            </div>
          </section>
        `).join("");
      }

      async function refresh() {
        const token = getToken();
        const options = token ? { headers: { Authorization: `Bearer ${token}` } } : {};
        let response = await fetch("/api/status", options);

        if (response.status === 401) {
          const retryToken = getToken(true);
          const retryOptions = retryToken ? { headers: { Authorization: `Bearer ${retryToken}` } } : {};
          response = await fetch("/api/status", retryOptions);
        }

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const data = await response.json();
        const servedAt = new Date(data.served_at);
        count.textContent = `${data.count} pane${data.count === 1 ? "" : "s"}`;
        updated.textContent = `Updated ${servedAt.toLocaleString()}`;
        updatedShort.textContent = servedAt.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        renderOverview(data);
        renderResources(data);
        renderPorts(data);
        renderQuota(data);

        if (!data.panes.length) {
          content.className = "empty";
          content.textContent = "No tmux panes found.";
          return;
        }

        renderPanes(data.panes);
      }

      async function loop() {
        try {
          await refresh();
        } catch (error) {
          content.className = "error";
          content.textContent = `Unable to load status: ${error.message}`;
          updated.textContent = "Refresh failed";
          updatedShort.textContent = "failed";
        }
      }

      loop();
      setInterval(loop, 10000);
    </script>
  </body>
</html>
